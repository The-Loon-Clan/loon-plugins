name: test
on: [push, pull_request]

jobs:
  # The unit suite: no services, so it is the fast signal on every push.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: loon-plugins
      # loon is a sibling module (go.mod replace => ../loon), so it has to be
      # on disk beside this one before anything resolves.
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon
          path: loon
      - uses: actions/setup-go@v5
        with:
          go-version-file: loon-plugins/go.mod
          cache-dependency-path: loon-plugins/go.sum

      - name: gofmt
        working-directory: loon-plugins
        # THE EXCLUSION IS TEMPORARY. Three files under requests/ carry
        # struct-field alignment drift that predates this workflow — whitespace
        # only, no semantic risk. They belong to a different workstream, so they
        # are skipped here rather than reformatted underneath somebody's open
        # editor. Run `gofmt -w requests/` and delete the grep once that
        # workstream is at a resting point; a permanent exclusion is how a
        # directory stops being checked at all.
        #
        # Do not "fix" a long list of findings on a Windows checkout: git there
        # runs with core.autocrlf, so the working tree is CRLF while the repo
        # stores LF, and a local `gofmt -l` reports every file git checked out.
        # The repo content is LF (755 blobs, none with CRLF); this job sees that.
        run: |
          out=$(gofmt -l . | grep -v '^requests/' || true)
          if [ -n "$out" ]; then
            echo "gofmt would change these files:"
            echo "$out"
            exit 1
          fi

      - name: vet
        working-directory: loon-plugins
        run: |
          go vet ./...
          # Separately, because the integration files are not compiled without
          # the tag — a build error in one of them would otherwise reach main
          # and only surface when somebody ran the integration suite.
          go vet -tags integration ./...

      - name: ownership sentinels
        working-directory: loon-plugins
        run: go run ./scripts/audit-sentinels ./...

      - name: test
        working-directory: loon-plugins
        run: go test ./...

  # The tests that need a real Postgres.
  #
  # These existed long before this job did — thirty-one files — and had never
  # run anywhere: each read its own environment variable, none of which was set
  # by anything, so every one of them skipped and the suite went green by doing
  # nothing. That is the whole reason this job exists.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: loon_plugins_test
        ports:
          - 5432:5432
        # Without this the job races the database and fails on connect.
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: loon-plugins
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon
          path: loon
      - uses: actions/setup-go@v5
        with:
          go-version-file: loon-plugins/go.mod
          cache-dependency-path: loon-plugins/go.sum

      - name: integration test
        working-directory: loon-plugins
        env:
          LOON_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          # The pre-pgtest tests each read their own name. Same DSN under all of
          # them, which is what scripts/itest.sh does locally; keep the two
          # lists together when one changes.
          ACHIEVEMENTS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          BACKUP_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          EVENTS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          NEWS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          RANKS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          REWARDS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          TICKETS_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          TRACKER_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          USENET_TEST_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
          INDEXER_TEST_DB_DSN: postgres://demo:demo@localhost:5432/loon_plugins_test?sslmode=disable
        # NOT a -run subset. A hardcoded list means an integration test added
        # later never runs and nobody is told.
        run: go test -tags integration -count=1 ./...

  # Everything that compiles against this repo, built from THIS commit.
  #
  # loon's CI already does the reverse. This direction was missing, and it is
  # the one that matters more: loon-plugins can break loon-demo-site
  # unilaterally — remove an exported helper, rename a field, widen an
  # interface — and every one of those compiles fine here and nowhere else.
  # scripts/check-consumers.sh has done this locally for a while; this is the
  # same check where nobody has to remember to run it.
  #
  # `go vet` AND NOT JUST `go build`, which is the detail this would otherwise
  # get wrong: build ignores _test.go files, and a consumer's test FAKE
  # implements our interfaces. Widening one breaks the fake and leaves the
  # build green. That happened on 2026-08-07 — AdminStore gained a method,
  # every consumer reported "ok", and the host's fakeRewardsAdmin had been
  # broken for two commits. vet type-checks tests, which is the cheapest way to
  # see it.
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: loon-plugins
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon
          path: loon
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon-baseline
          path: loon-baseline
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon-demo-site
          path: loon-demo-site

      - uses: actions/setup-go@v5
        with:
          go-version-file: loon-plugins/go.mod

      # The host pins its siblings by pseudo-version, not by `replace`, so
      # without this it would compile against the LAST PUSHED loon-plugins and
      # say nothing about this commit. All three siblings are redirected, not
      # just this one: mixing a working-tree loon-plugins with a pinned loon is
      # a combination nobody ever runs, and a failure there would be noise.
      - name: Point the host at these working trees
        working-directory: loon-demo-site
        run: |
          go mod edit \
            -replace github.com/the-loon-clan/loon=../loon \
            -replace github.com/the-loon-clan/loon-plugins=../loon-plugins \
            -replace github.com/the-loon-clan/loon-baseline=../loon-baseline
        env:
          GOWORK: "off"

      - name: loon-demo-site builds against this commit
        working-directory: loon-demo-site
        run: go build ./...
        env:
          GOWORK: "off"
          GOFLAGS: "-buildvcs=false -mod=mod"

      - name: ...and its tests still compile
        working-directory: loon-demo-site
        run: go vet ./...
        env:
          GOWORK: "off"
          GOFLAGS: "-buildvcs=false -mod=mod"

  # Every plugin must say which half of a site it belongs to (CHECKLIST §1).
  #
  # REPORTING, NOT FAILING, and deliberately. The three plugins without a
  # Flavours declaration — agent, ranks, requests — belong to another
  # workstream, and turning their build red for it would be handing somebody
  # else a broken CI over a change they did not make. The number is visible in
  # the job summary instead, so it can be handed over rather than imposed.
  #
  # Make this a failing step once those three declare, and delete this comment
  # with it.
  flavours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flavours declared
        run: |
          python3 scripts/audit_flavours.py | tee /tmp/flavours.txt || true
          {
            echo "### Plugin flavours"
            echo
            echo '```'
            tail -1 /tmp/flavours.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
