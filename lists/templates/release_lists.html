{{define "release_lists.html"}}
    <div class="container mt-4">
        <div class="mb-3">
            <a class="text-primary" href="/release/{{.Nzb.ID}}">&#8592; Back to release</a>
        </div>
        <h6 class="text-muted mb-3">Lists containing <strong class="text-light">{{.Nzb.Title}}</strong></h6>
        <div class="panelV2">
            <table class="data-table mb-0">
                <caption class="visually-hidden">Lists containing {{.Nzb.Title}}</caption>
                <tbody>
                    {{range .Lists}}
                    <tr>
                        <td><a href="/lists/{{.ID}}" style="color:var(--text-primary);font-weight:500;">{{.Name}}</a>
                            <div class="text-muted fs-xs">by {{.Username}}</div>
                        </td>
                        <td style="color:var(--text-muted);font-size:0.85rem;width:80px;">{{.ItemCount}} items</td>
                    </tr>
                    {{else}}
                    <tr><td class="text-center" style="color:var(--text-muted);padding:2rem;">Not in any lists yet.</td></tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
{{end}}
