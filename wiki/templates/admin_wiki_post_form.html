{{define "admin_wiki_post_form.html"}}
    <style>
        .editor-wrap { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; min-height: 520px; }
        .editor-wrap textarea {
            flex: 1; border: none; border-right: 1px solid var(--border); border-radius: 0;
            resize: none; font-family: monospace; font-size: 0.82rem;
            background: var(--bg-elevated); color: var(--text-primary); padding: 0.75rem;
            outline: none; line-height: 1.6;
        }
        .editor-wrap textarea:focus { box-shadow: none; }
        .preview-pane {
            flex: 1; overflow-y: auto; padding: 1rem;
            background: var(--bg-surface); font-size: 0.875rem;
            color: var(--text-primary); line-height: 1.7;
        }
        .toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
        .toolbar button, .toolbar label {
            font-size: 0.78rem; padding: 2px 9px; line-height: 1.6;
            background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text-primary); border-radius: 4px; cursor: pointer;
        }
        .toolbar button:hover, .toolbar label:hover { background: var(--border); }
        /* Preview styles */
        .preview-pane h1,.preview-pane h2,.preview-pane h3,
        .preview-pane h4,.preview-pane h5,.preview-pane h6 { margin-top:1.25rem;margin-bottom:0.4rem;color:var(--text-primary);font-weight:600; }
        .preview-pane p { margin-bottom:0.75rem; }
        .preview-pane code { background:var(--bg-elevated);padding:0.15em 0.4em;border-radius:3px;font-size:0.875em;color:var(--blue); }
        .preview-pane pre { background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:0.75rem;overflow-x:auto;margin-bottom:0.75rem; }
        .preview-pane pre code { background:none;padding:0;color:var(--text-primary); }
        .preview-pane blockquote { border-left:3px solid var(--border);padding-left:1rem;margin-left:0;color:var(--text-muted);margin-bottom:0.75rem; }
        .preview-pane img { max-width:100%;border-radius:4px; }
        .preview-pane table { width:100%;border-collapse:collapse;margin-bottom:0.75rem; }
        .preview-pane th,.preview-pane td { border:1px solid var(--border);padding:0.4rem 0.6rem; }
        .preview-pane th { background:var(--bg-elevated); }
        .preview-pane a { color:var(--blue); }
        .preview-pane ul,.preview-pane ol { padding-left:1.5rem;margin-bottom:0.75rem; }
        .preview-pane hr { border-color:var(--border);margin:1rem 0; }
    </style>

    <div class="container mt-4 page-wide">

        <div class="d-flex align-items-center gap-3 mb-3">
            <h6 class="mb-0" style="color:var(--text-muted);">{{.Action}} Post</h6>
            <a href="/admin/wiki" class="btn btn-outline-secondary btn-sm ms-auto">← Back</a>
        </div>

        <div class="card">
            <div class="card-body">
                {{if eq .Action "Edit"}}
                <form method="POST" action="/admin/wiki/posts/{{.Post.ID}}/update" id="post-form">
                    <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                    <input type="hidden" name="topic_id" value="{{.Post.TopicID}}">
                {{else}}
                <form method="POST" action="/admin/wiki/posts" id="post-form">
                    <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                    <input type="hidden" name="topic_id" value="{{.TopicID}}">
                {{end}}

                    <div class="mb-3">
                        <label class="form-label" style="font-size:0.85rem;">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" required maxlength="512"
                               value="{{if .Post}}{{.Post.Title}}{{end}}">
                    </div>

                    <div class="mb-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label mb-0" style="font-size:0.85rem;">Content (HTML)</label>
                            <div style="font-size:0.75rem;color:var(--text-muted);">Editor ↔ Live Preview</div>
                        </div>

                        <div class="toolbar" id="toolbar">
                            <button type="button" data-tag="b" title="Bold"><strong>B</strong></button>
                            <button type="button" data-tag="i" title="Italic"><em>I</em></button>
                            <button type="button" data-tag="u" title="Underline"><u>U</u></button>
                            <button type="button" data-tag="s" title="Strikethrough"><s>S</s></button>
                            <button type="button" data-tag="h2" title="Heading 2">H2</button>
                            <button type="button" data-tag="h3" title="Heading 3">H3</button>
                            <button type="button" data-tag="h4" title="Heading 4">H4</button>
                            <button type="button" data-insert="&lt;a href=&quot;&quot;&gt;link text&lt;/a&gt;" title="Link">Link</button>
                            <button type="button" data-tag="code" title="Inline code">Code</button>
                            <button type="button" data-insert="&lt;pre&gt;&lt;code&gt;&#10;code here&#10;&lt;/code&gt;&lt;/pre&gt;" title="Code block">Code Block</button>
                            <button type="button" data-insert="&lt;ul&gt;&#10;  &lt;li&gt;&lt;/li&gt;&#10;&lt;/ul&gt;" title="Unordered list">UL</button>
                            <button type="button" data-insert="&lt;ol&gt;&#10;  &lt;li&gt;&lt;/li&gt;&#10;&lt;/ol&gt;" title="Ordered list">OL</button>
                            <button type="button" data-tag="blockquote" title="Blockquote">Quote</button>
                            <button type="button" data-insert="&lt;hr&gt;" title="Horizontal rule">HR</button>
                            <button type="button" data-insert="&lt;p&gt;&lt;/p&gt;" title="Paragraph">P</button>
                            <label title="Upload image" style="margin:0;">
                                📎 Image
                                <input type="file" id="img-upload" accept="image/*" style="display:none;">
                            </label>
                        </div>

                        <div class="editor-wrap">
                            <textarea id="content" name="content" spellcheck="false">{{if .Post}}{{.Post.Content}}{{end}}</textarea>
                            <div class="preview-pane" id="preview"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary btn-sm">{{.Action}} Post</button>
                        <a href="/admin/wiki" class="btn btn-outline-secondary btn-sm">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    (function(){
        var editor  = document.getElementById('content');
        var preview = document.getElementById('preview');

        function updatePreview() {
            preview.innerHTML = editor.value;
        }
        editor.addEventListener('input', updatePreview);
        updatePreview();

        // Toolbar: wrap selection in a tag, or insert raw HTML
        document.getElementById('toolbar').addEventListener('click', function(e) {
            var btn = e.target.closest('[data-tag],[data-insert]');
            if (!btn) return;
            e.preventDefault();
            editor.focus();

            var start = editor.selectionStart;
            var end   = editor.selectionEnd;
            var val   = editor.value;
            var sel   = val.slice(start, end);

            var inserted;
            if (btn.dataset.tag) {
                var tag = btn.dataset.tag;
                inserted = '<' + tag + '>' + (sel || '') + '</' + tag + '>';
            } else {
                // Decode HTML entities in data-insert
                var tmp = document.createElement('textarea');
                tmp.innerHTML = btn.dataset.insert;
                inserted = tmp.value;
            }

            editor.value = val.slice(0, start) + inserted + val.slice(end);
            // Place cursor inside the inserted tag if nothing was selected
            var cursor = start + (btn.dataset.tag
                ? btn.dataset.tag.length + 2  // after <tag>
                : inserted.length);
            editor.selectionStart = editor.selectionEnd = cursor;
            updatePreview();
        });

        // Image upload
        document.getElementById('img-upload').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var fd = new FormData();
            fd.append('file', file);
            fetch('/admin/wiki/upload', { method: 'POST', body: fd })
                .then(function(r){ return r.json(); })
                .then(function(d){
                    if (d.error) { alert('Upload failed: ' + d.error); return; }
                    var tag = '<img src="' + d.url + '" alt="' + file.name + '">';
                    var start = editor.selectionStart;
                    editor.value = editor.value.slice(0, start) + tag + editor.value.slice(start);
                    editor.selectionStart = editor.selectionEnd = start + tag.length;
                    editor.focus();
                    updatePreview();
                })
                .catch(function(){ alert('Upload failed'); });
            e.target.value = '';
        });
    })();
    </script>
{{end}}
