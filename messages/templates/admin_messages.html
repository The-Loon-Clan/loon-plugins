{{define "admin_messages.html"}}

    <div class="container mt-4 site-container">
        <div class="panelV2 mb-4">
            <div class="panel__header">Compose Message</div>
            <div class="panel__body">
                <form method="POST" action="/admin/messages">
            <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                    <div class="mb-3">
                        <label class="form__label">To</label>
                        <select aria-label="To" name="target" class="form__select">
                            <option value="all">Everyone</option>
                            <option value="admin">All Admins</option>
                            {{range .Users}}
                            <option value="user:{{.ID}}">{{.Username}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form__label">Title</label>
                        <input aria-label="Title" type="text" name="title" class="form__input" required>
                    </div>
                    <div class="mb-3">
                        <label class="form__label">Message</label>
                        <textarea aria-label="Message" name="body" class="form__input" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="button button--primary">Send Message</button>
                </form>
            </div>
        </div>

        <div class="panelV2">
            <div class="panel__header d-flex justify-content-between align-items-center">
                <span>Sent Messages</span>
                <small style="color:var(--text-muted);">{{.Total}} total</small>
            </div>
            <table class="data-table mb-0">
            <caption class="visually-hidden">Sent site messages</caption>
                <thead>
                    <tr>
                        <th>From</th>
                        <th>Title</th>
                        <th>To</th>
                        <th>Sent</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Messages}}
                    <tr>
                        <td>{{.FromName}}</td>
                        <td>{{.Title}}</td>
                        <td>{{.Target}}</td>
                        <td style="white-space:nowrap;">{{.CreatedAt.Format "Jan 02 15:04"}}</td>
                        <td>
                            <form method="POST" action="/admin/messages/{{.ID}}/delete" style="display:inline;">
            <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                                <button type="submit" class="button button--sm button--danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {{else}}
                    <tr><td colspan="5" class="text-center" style="color:var(--text-muted);">No messages sent yet.</td></tr>
                    {{end}}
                </tbody>
            </table>
            {{.PaginationHTML}}
        </div>
    </div>

{{end}}
