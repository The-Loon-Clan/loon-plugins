{{define "news.html"}}
    <style>
        .news-page { margin: 0 auto; padding: 2rem 1rem 4rem; }
        .news-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .news-page-header .eyebrow {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .news-page-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .news-grid { display: flex; flex-direction: column; gap: 1rem; }

        .news-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .news-card:hover {
            border-color: var(--blue);
            background: var(--bg-elevated);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .news-card__header {
            display: flex;
            align-items: flex-start;
            width: 100%;
            background: transparent;
            border: none;
            padding: 1.2rem 1.4rem;
            color: var(--text-primary);
            text-align: left;
            gap: 1rem;
            cursor: pointer;
        }
        .news-card__header .news-card__title-wrap { flex: 1; min-width: 0; }
        .news-card__header .news-card__meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .news-card__header .news-card__title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
            transition: color 0.2s ease;
        }
        .news-card:hover .news-card__title { color: var(--blue); }
        .news-card__header .toggle-icon {
            transition: transform 0.2s ease;
            flex-shrink: 0;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }
        .news-card__header[aria-expanded="true"] .toggle-icon { transform: rotate(180deg); }

        .news-card__content {
            padding: 0 1.4rem 1.3rem 1.4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.65;
        }
        .news-card__content::before {
            content: "";
            display: block;
            height: 1px;
            background: var(--border);
            margin: 0 0 1.1rem 0;
        }
        .news-content p { margin-bottom: 0.7rem; }
        .news-content p:last-child { margin-bottom: 0; }
    </style>
    <div class="container page-narrow news-page">

        <div class="news-page-header">
            <div>
                <div class="eyebrow">News</div>
                <h1>All Posts</h1>
            </div>
        </div>

        {{if .News}}
        <div id="news-accordion" class="news-grid">
            {{range $i, $post := .News}}
            <div class="news-card">
                <button class="news-card__header"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#news-{{$post.ID}}"
                        aria-expanded="{{if eq $i 0}}true{{else}}false{{end}}"
                        aria-controls="news-{{$post.ID}}">
                    <div class="news-card__title-wrap">
                        <div class="news-card__meta">{{$post.CreatedAt.Format "Jan 02, 2006"}}</div>
                        <div class="news-card__title">{{$post.Title}}</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="toggle-icon" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </button>
                <div id="news-{{$post.ID}}" class="collapse {{if eq $i 0}}show{{end}}" data-bs-parent="#news-accordion">
                    <div class="news-card__content">
                        <div class="news-content">{{$post.Body}}</div>
                        <div class="mt-3">
                            <a href="/news/{{$post.Slug}}" class="btn btn-outline-primary btn-sm">Read more</a>
                        </div>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
        {{else}}
        <div class="text-center py-5" style="color:var(--text-muted);">No news yet.</div>
        {{end}}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{{end}}
