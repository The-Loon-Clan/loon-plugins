{{define "admin_news_form.html"}}
    <div class="container mt-4">

        <div class="d-flex align-items-center gap-3 mb-4">
            <h2 class="mb-0 fs-lg text-muted">Edit News Post</h2>
            <a href="/admin/news" class="button button--outlined button--sm ms-auto">← Back</a>
        </div>

        <div class="panelV2">
            <div class="panel__body">
                <form method="POST" action="/admin/news/{{.Post.ID}}/update">
                    <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                    <div class="mb-3">
                        <label class="form__label fs-sm">Title</label>
                        <input aria-label="Title" type="text" name="title" class="form__input" required maxlength="255"
                               value="{{.Post.Title}}">
                    </div>
                    <div class="mb-3">
                        <label class="form__label fs-sm">Slug</label>
                        <input aria-label="Slug" type="text" name="slug" class="form__input" maxlength="255"
                               value="{{.Post.Slug}}" placeholder="e.g. new-feature-announcement">
                        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:3px;">
                            URL: /news/{{.Post.Slug}}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form__label fs-sm">Body (HTML allowed)</label>
                        <textarea aria-label="Body (HTML allowed)" name="body" class="form__input" rows="12" required
                            style="font-family:monospace;font-size:0.82rem;">{{.Post.Body}}</textarea>
                        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">
                            You can use HTML tags: &lt;p&gt;, &lt;strong&gt;, &lt;em&gt;, &lt;a href=""&gt;, &lt;ul&gt;, &lt;li&gt;, etc.
                        </div>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" name="published" value="1" id="edit-published"
                               {{if .Post.Published}}checked{{end}}>
                        <label class="form-check-label fs-sm" for="edit-published">Published (visible to users)</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="button button--primary">Save Changes</button>
                        <a href="/news/{{.Post.Slug}}" target="_blank" class="button button--outlined">Preview</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

{{end}}
