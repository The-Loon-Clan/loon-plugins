{{define "news_detail.html"}}
    <style>
        .news-body { font-size: 0.9rem; line-height: 1.7; color: var(--text-muted); }
        .news-body p { margin-bottom: 0.8rem; }
        .news-body h2, .news-body h3 { color: var(--text-primary); margin-top: 1.5rem; }
        .news-body a { color: var(--blue); }
        .news-body img { max-width: 100%; border-radius: 4px; margin: 0.5rem 0; }
        .news-body ul, .news-body ol { padding-left: 1.5rem; margin-bottom: 0.8rem; }
    </style>
    <div class="container mt-4 site-container">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb" style="font-size:0.85rem;">
                <li class="breadcrumb-item"><a href="/news" style="color:var(--text-muted);">News</a></li>
                <li class="breadcrumb-item active" style="color:var(--text-primary);">{{.Post.Title}}</li>
            </ol>
        </nav>

        <div class="card">
            <div class="card-body p-4">
                <h1 style="font-size:1.5rem;font-weight:600;margin-bottom:0.5rem;">{{.Post.Title}}</h1>
                <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:1.5rem;">
                    {{.Post.CreatedAt.Format "January 02, 2006"}}
                </p>
                <div class="news-body">{{.Post.Body}}</div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/news" class="btn btn-outline-secondary btn-sm">← All News</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{{end}}
